name: Avisos push
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: avisos
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - name: Enviar avisos
        run: node avisos/avisos.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
